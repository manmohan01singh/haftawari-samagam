<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>YouTube Gurbani</title>
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="Haftawari and Amritvela kirtan samagams, scheduled and shared." />
    <!-- SPA fallback restore (pairs with public/404.html): GitHub
         Pages serves 404.html for deep app URLs; that page redirects
         here with the path encoded as ?/path. Restore the real URL
         before the bundle boots so React Navigation linking opens
         the intended screen. Standard spa-github-pages snippet. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <!-- PWA manifest (public/manifest.webmanifest) + install icons.
         Relative hrefs: the web build is served under a base path
         (experiments.baseUrl, e.g. GitHub Pages /haftawari-samagam/),
         so root-absolute paths would 404. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <!-- Warm up the connections the first screen needs (QA perf pass):
         the backend (feed data), the YouTube API (channel data) and
         the thumbnail CDN. DNS + TLS for these complete while the JS
         bundle downloads/parses instead of serially afterwards. -->
    <link rel="preconnect" href="https://umbdfrjxcxootvshxveg.supabase.co" />
    <link rel="preconnect" href="https://www.googleapis.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="preconnect" href="https://www.youtube.com" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* App background from the first paint — no grey/white flash
           while the bundle loads (QA issue 1). */
        background-color: #ffffff;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Tap reliability (PWA): `manipulation` removes the double-tap-zoom
         gesture (and its tap delay / swallowed first taps) on mobile
         browsers for every element that is not a scroll surface, and the
         transparent highlight removes the grey flash that made taps feel
         unregistered. Scroll containers keep their native panning:
         react-native-web sets its own touch-action on them. */
      html,
      body {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      [role='button'],
      a,
      button,
      input,
      textarea {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      /* Gesture hygiene (UX Fix 2, gestures round): a drag must never
         turn into a text selection or a long-press callout — the live
         audit caught a pull-down on the Home header selecting the
         title text (blue highlight) instead of gesturing, which is
         exactly the kind of fight that makes drags feel broken.
         App-shell text is not selectable; real inputs stay selectable
         so search/chat fields behave normally. */
      body {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      input,
      textarea,
      [contenteditable='true'] {
        -webkit-user-select: text;
        user-select: text;
      }
    </style>
    <style id="app-splash">
      /* Static first-paint shell (QA issues 1/2/4): shown by the
         browser BEFORE any JavaScript runs, so a cold load is never a
         blank grey page. React replaces #root's contents on mount.
         Pure CSS — no JS, ~0 cost. Colours mirror the app
         theme (white surface, #f2f2f2 skeleton, own brand mark). */
      .app-splash {
        position: absolute;
        inset: 0;
        background-color: #ffffff;
        font-family: -apple-system, Roboto, 'Segoe UI', sans-serif;
        color: #0f0f0f;
        display: flex;
        flex-direction: column;
      }
      .app-splash-bar {
        height: 56px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 16px;
      }
      .app-splash-mark {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        flex: none;
        display: block;
      }
      .app-splash-name {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -0.3px;
      }
      .app-splash-suffix {
        font-size: 13px;
        font-weight: 600;
        color: #606060;
        margin-left: 3px;
        letter-spacing: 0;
      }
      .app-splash-glow {
        position: absolute;
        top: -185px;
        left: -185px;
        width: 470px;
        height: 470px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 32, 32, 0.07) 0%, rgba(255, 32, 32, 0.03) 55%, rgba(255, 32, 32, 0) 100%);
        pointer-events: none;
      }
      .app-splash-hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 34px 16px 26px;
      }
      .app-splash-ik {
        font-family: 'Noto Serif Gurmukhi', 'Noto Sans Gurmukhi', serif;
        font-size: 92px;
        line-height: 1.15;
        color: #e8112d;
        animation: app-splash-breathe 3.2s ease-in-out infinite;
      }
      .app-splash-loading {
        color: #606060;
        font-size: 14px;
        margin-top: 2px;
      }
      @keyframes app-splash-breathe {
        0%, 100% { opacity: 0.82; transform: scale(0.99); }
        50% { opacity: 1; transform: scale(1.01); }
      }
      @font-face {
        font-family: 'Noto Serif Gurmukhi';
        src: url('fonts/noto-serif-gurmukhi.woff2') format('woff2');
        font-weight: 700;
        font-display: swap;
      }
      @media (prefers-color-scheme: dark) {
        .app-splash { background-color: #0f0f0f; color: #ffffff; }
        .app-splash-suffix { color: #aaaaaa; }
        .app-splash-loading { color: #aaaaaa; }
        .app-splash-thumb, .app-splash-line { background-color: #262626; }
        .app-splash-glow { background: radial-gradient(circle, rgba(255, 32, 32, 0.15) 0%, rgba(255, 32, 32, 0.05) 55%, rgba(255, 32, 32, 0) 100%); }
      }
      .app-splash-card {
        padding-bottom: 16px;
      }
      .app-splash-thumb {
        width: 100%;
        aspect-ratio: 16 / 9;
        background-color: #f2f2f2;
      }
      .app-splash-lines {
        padding: 12px 16px 0;
      }
      .app-splash-line {
        height: 17px;
        border-radius: 4px;
        background-color: #f2f2f2;
        margin-bottom: 6px;
      }
    </style>
