<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="Haftawari and Amritvela kirtan samagams, scheduled and shared." />
    <!-- PWA manifest (public/manifest.webmanifest) + install icons.
         Relative hrefs: the web build is served under a base path
         (experiments.baseUrl, e.g. GitHub Pages /haftawari-samagam/),
         so root-absolute paths would 404. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      Haftawari Samagam needs JavaScript to run. Please enable JavaScript in your browser and
      reload this page.
    </noscript>
    <!-- The root element for your Expo app. The loading text below is
         replaced by React on first render; it only shows while the
         bundle is loading. -->
    <div id="root">
      <p style="font-family: sans-serif; color: #666; margin: auto; padding: 24px">Loading…</p>
    </div>
  </body>
</html>
